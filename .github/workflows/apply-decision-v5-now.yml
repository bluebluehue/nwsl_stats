name: Apply Decision v5 now

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install requests

      - name: Apply rolling-validated Decision v5
        run: python apply_decision_v5.py

      - name: Commit refreshed Decision ratings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transformed_data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply Decision v5 with recent opportunity"
            git push
          fi
