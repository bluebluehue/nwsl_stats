name: Audit NWSL Opta stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NWSL Opta discovery audit
        run: |
          python audit_nwsl_opta_stats.py

      - name: Show generated files
        if: always()
        run: |
          echo "Files after audit:"
          ls -lah

          if [ -f nwsl_opta_discovery_audit.json ]; then
            echo ""
            echo "Discovery audit created."
          fi

          if [ -f nwsl_opta_stats_audit.json ]; then
            echo ""
            echo "Stats audit created."

            python - <<'PY'
          import json

          with open(
              "nwsl_opta_stats_audit.json",
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          meta = data.get("metadata", {})

          print(
              "Season ID:",
              meta.get("season_id"),
          )
          print(
              "Players:",
              meta.get("player_count"),
          )
          print(
              "Unique stats:",
              meta.get("unique_stat_count"),
          )
          print(
              "All 9 involvement targets:",
              meta.get(
                  "all_target_concepts_found"
              ),
          )
          PY
          fi

      - name: Commit audit files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f nwsl_opta_discovery_audit.json ]; then
            git add nwsl_opta_discovery_audit.json
          fi

          if [ -f nwsl_opta_stats_audit.json ]; then
            git add nwsl_opta_stats_audit.json
          fi

          if git diff --cached --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "Audit NWSL Opta API structure"
            git push
          fi
