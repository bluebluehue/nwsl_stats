name: Refresh NWSL involvement

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-involvement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch NWSL involvement
        run: |
          python fetch_nwsl_involvement.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("nwsl_involvement.json")

          if not path.exists():
              raise SystemExit(
                  "nwsl_involvement.json was not created."
              )

          with path.open(
              "r",
              encoding="utf-8",
          ) as f:
              data = json.load(f)

          players = data.get(
              "players",
              [],
          )

          if not players:
              raise SystemExit(
                  "No players found in involvement output."
              )

          print(
              "Players:",
              len(players),
          )

          print()
          print("Stat resolution:")

          for concept, result in (
              data
              .get(
                  "statResolution",
                  {},
              )
              .items()
          ):
              print(
                  concept,
                  "=>",
                  result.get(
                      "playersMatched"
                  ),
                  result.get(
                      "labelsUsed"
                  ),
              )

          print()
          print("Top players:")

          for position, summary in (
              data
              .get(
                  "positionSummary",
                  {},
              )
              .items()
          ):
              print()
              print(position)

              for row in (
                  summary
                  .get(
                      "topPlayers",
                      [],
                  )[:5]
              ):
                  print(
                      row.get("rating"),
                      row.get("name"),
                      row.get("team"),
                      "minutes=",
                      row.get("minutes"),
                      "confidence=",
                      row.get(
                          "sampleConfidence"
                      ),
                  )
          PY

      - name: Commit involvement data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nwsl_involvement.json

          if git diff --cached --quiet; then
            echo "No involvement changes to commit."
          else
            git commit -m "Refresh NWSL involvement data"
            git push
          fi
