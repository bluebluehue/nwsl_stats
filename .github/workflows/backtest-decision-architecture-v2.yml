name: Backtest Decision architecture v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run Decision architecture backtest
        run: python backtest_decision_architecture_v2.py

      - name: Commit backtest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decision_architecture_backtest_v2.json decision_architecture_backtest_v2_samples.csv
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
          else
            git commit -m "Refresh Decision architecture v2 backtest"
            git push
          fi
