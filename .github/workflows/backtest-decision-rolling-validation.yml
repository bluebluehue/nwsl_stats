name: Backtest Decision rolling validation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run rolling Decision validation
        run: python backtest_decision_rolling_validation.py

      - name: Commit backtest outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decision_rolling_validation.json decision_rolling_validation_candidates.csv
          if git diff --cached --quiet; then
            echo "No rolling-validation changes to commit."
          else
            git commit -m "Refresh Decision rolling validation"
            git push
          fi
