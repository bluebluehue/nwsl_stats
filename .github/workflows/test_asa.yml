name: Test ASA API

on:
  workflow_dispatch:

jobs:
  test-asa:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run ASA test
        run: python test_asa.py
